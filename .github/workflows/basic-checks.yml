name: Basic installer checks

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_privileged_e2e:
        description: Explicitly run privileged systemd E2E on disposable GitHub-hosted VMs
        type: boolean
        required: true
        default: false
      disposable_linux_vm:
        description: Confirm the disposable Linux VM; privileged Docker is NOT host isolation
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: basic-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck и синтаксис
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in install.sh uninstall.sh tests/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x -S style install.sh uninstall.sh tests/*.sh

  xray-pin:
    name: Сверка закреплённого Xray с релизом
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Скачать архивы и сверить SHA256 и .dgst
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/check-xray-pin.sh "$RUNNER_TEMP/xray"
      - uses: actions/upload-artifact@v4
        with:
          name: xray-release
          path: ${{ runner.temp }}/xray/Xray-linux-64.zip
          retention-days: 3

  tests:
    name: Тесты без systemd (Ubuntu ${{ matrix.ubuntu }})
    needs: [lint, xray-pin]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xray-release
          path: ${{ runner.temp }}/xray
      - name: unit
        run: MIFA_TEST_XRAY_ZIP_HOST="$RUNNER_TEMP/xray/Xray-linux-64.zip" bash tests/run-docker.sh unit "${{ matrix.ubuntu }}"
      - name: REALITY-проверка против локального TLS-сервера
        run: MIFA_TEST_XRAY_ZIP_HOST="$RUNNER_TEMP/xray/Xray-linux-64.zip" bash tests/run-docker.sh reality "${{ matrix.ubuntu }}"
      - name: Отказы без изменения системы
        run: MIFA_TEST_XRAY_ZIP_HOST="$RUNNER_TEMP/xray/Xray-linux-64.zip" bash tests/run-docker.sh guards "${{ matrix.ubuntu }}"
      - name: preflight, plan и dry-run не меняют систему
        run: MIFA_TEST_XRAY_ZIP_HOST="$RUNNER_TEMP/xray/Xray-linux-64.zip" bash tests/run-docker.sh nochange "${{ matrix.ubuntu }}"
      - name: preflight, plan и dry-run с настоящей загрузкой Xray
        run: |
          # Без локального архива: установщик сам скачивает и проверяет Xray.
          MIFA_NOCHANGE_EXPECT_SANDBOX=1 bash tests/run-docker.sh nochange "${{ matrix.ubuntu }}"

  e2e:
    name: Basic lifecycle E2E (Ubuntu 24.04, disposable systemd container)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_privileged_e2e == true && inputs.disposable_linux_vm == true
    needs: [lint, xray-pin]
    runs-on: ubuntu-24.04
    # Leave time after the runner's bounded build/test for cleanup and artifacts.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04"]
    env:
      # One real Xray lifecycle, using the existing controlled local TLS target.
      MIFA_E2E_FREEZE_SMOKE: '1'
    steps:
      - name: Require a disposable GitHub-hosted Linux runner
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xray-release
          path: ${{ runner.temp }}/xray
      - name: cgroup на раннере
        run: stat -fc %T /sys/fs/cgroup
      - name: e2e
        env:
          MIFA_TEST_XRAY_ZIP_HOST: ${{ runner.temp }}/xray/Xray-linux-64.zip
        # The hosted VM is disposable; privileged Docker itself is NOT isolation.
        run: bash tests/run-ci-docker.sh e2e "${{ matrix.ubuntu }}" "$RUNNER_TEMP/e2e-results" --disposable-linux-vm
      - name: E2E summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/e2e-results/summary.md" ]]; then
            cat "$RUNNER_TEMP/e2e-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'E2E did not produce a result; inspect setup/cancellation errors.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ubuntu-${{ matrix.ubuntu }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-results/
          retention-days: 7
          if-no-files-found: error
